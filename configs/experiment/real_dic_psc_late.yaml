# @package _global_
defaults:
  - override /data: real
  - override /model: unified_real

data:
  image_size: 448
  domain_size: 1024
  n_objects: 141
  generator:
    n_trajectories: 8
    trajectory_length: 32
    cache_dir: ${oc.env:DATA_DIR,./data}/ctc_dic_psc_late_cache/
  params:
    videos:
      - {dataset: DIC-C2DH-HeLa, seq: "01", frame_start: 19,  frame_end: 84}
      - {dataset: DIC-C2DH-HeLa, seq: "02", frame_start: 19,  frame_end: 84}
      - {dataset: PhC-C2DL-PSC,  seq: "01", frame_start: 223, frame_end: 288, roi: [176, 400, 248, 472]}
      - {dataset: PhC-C2DL-PSC,  seq: "02", frame_start: 223, frame_end: 288, roi: [176, 400, 248, 472]}
    r_max_px: 152
    window_length: 32
    contact_frac: 1.0
    min_track_length: 5
    max_windows_per_video: null

model:
  embedding_dim: 16
  interaction_dim: 24
  hidden_dim: 512
  hidden_layers: 1
  embedding_noise_std: 0.1
  input_noise_std: 0.0
  L_dropout_prob: 0.3
  L_skip_connection: true

training:
  n_epochs: 800
  loss_terms:
    position_mse: 1.0
    velocity_mse: 1.0
    dino_mse: 1.0
    scale_mse: 1.0
    parameter_embedding_l2: 0
  finetune_decoder:
    enabled: true
    n_trajectories: null
  rollout:
    enabled: false

dataloader:
  batch_size: 2
  scale_norm: dataset_id
  val_split_mode: temporal
  train_ratio: 1.0
  val_ratio: 0.0
  test_ratio: 0.0

augmentation:
  enabled: false

tags:
  dataset: ctc_dic_psc_late
