# @package _global_
defaults:
  - override /data: polyhoop
  - override /model: unified_dino

data:
  image_size: 128
  domain_size: 120
  n_objects: 600
  generator:
    n_trajectories: 3
    trajectory_length: 2000
    seed_offset: 42
    cache_dir: ${oc.env:DATA_DIR,./data}/osc_amp_x_adhesion_cache/
  params:
    radius: 2.0

    oscillatory_growth: true
    area_fluct_period: 2
    random_phases: true
    area_fluct_amp:
      dist: linspace
      min: 0.785398
      max: 3.141593
      steps: 2
      repeats: 300
      interleaved: true

    kh:
      dist: logspace
      min: 1e4
      max: 5e4
      steps: 2
      repeats: 300
      interleaved: false

    fp: 50
    Dr: 1
    placement: hex_grid
    shuffle_placement: true
    wall_box: true
    wall_box_size: 0
    wall_kh: 0

model:
  embedding_dim: 2
  interaction_dim: 2
  hidden_dim: 512
  hidden_layers: 1
  embedding_noise_std: 0.1
  input_noise_std: 0.1
  L_skip_connection: true
  L_dropout_prob: 0.2

training:
  n_epochs: 150
  loss_terms:
    position_mse: 1.0
    velocity_mse: 1.0
    dino_mse: 1.0
    scale_mse: 1.0
    parameter_embedding_l2: 0
  finetune_decoder:
    loss_terms:
      embedding_l2: 0.0
  rollout:
    enabled: false

dataloader:
  train_ratio: 0.9
  val_ratio: 0.1
