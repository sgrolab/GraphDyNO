# @package _global_
defaults:
  - override /data: polyhoop
  - override /model: unified_dino

data:
  image_size: 128
  generator:
    n_trajectories: 3
    trajectory_length: 2500
    seed_offset: 42
    cache_dir: ${oc.env:DATA_DIR,./data}/oscillating_cell_more_amp_cache/
  params:
    radius: 2.0
    oscillatory_growth: true
    random_phases: false
    area_fluct_period:
      dist: inverse_linspace
      min: 1
      max: 5
      steps: 20
      repeats: 20
      interleaved: true
    area_fluct_amp:
      dist: linspace
      min: 0.785398
      max: 6.283185
      steps: 20
      repeats: 20
      interleaved: false
    density_fraction: 0.94

model:
  embedding_dim: 2
  interaction_dim: 32
  hidden_dim: 64
  hidden_layers: 1
  embedding_noise_std: 0.1
  gnn_inputs: [L, scale, L_velocity, scale_velocity]
  position_inputs: [x_features, interactions]
  shape_mlps:
    - [x_features, L, interactions, L_velocity, b]
  scale_mlps:
    - [x_features, interactions, scale, scale_velocity, b]

training:
  n_epochs: 120
  loss_terms:
    position_mse: 1.0
    velocity_mse: 1.0
    dino_mse: 1.0
    scale_mse: 1.0
    parameter_embedding_l2: 1e-3
  rollout:
    enabled: true
    schedule:
      - [0, 1]
      - [40, 2]
      - [80, 4]

dataloader:
  train_ratio: 0.9
  val_ratio: 0.1
