[pytest]
python_files = tests.py test_*.py *_tests.py

# Pytest configuration

# Verbosity and output options
addopts = -v --strict-markers --tb=short -m "not benchmark and not gpu"

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    comparison: marks tests that compare implementations
    benchmark: marks performance benchmarking tests (skipped by default, run with '-m benchmark' or '--benchmark')
    gpu: marks tests that need a GPU and the full experiment caches (skipped by default, run with '-m gpu')

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Console output style
console_output_style = progress
