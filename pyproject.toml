[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph_dyno"
version = "0.1.0"
description = "Discovering interaction laws via graph neural networks: training pipeline, PolyHoop trajectory generator and paper figures"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Pinned to the versions the paper's runs used (requirements.txt); uv.lock pins
# everything else. torch/torchvision come from the CUDA 13 index on Linux.
dependencies = [
    "cairosvg==2.7.1",
    "cmocean==4.0.3",
    "huggingface-hub==1.4.1",
    "hydra-core==1.3.2",
    "matplotlib==3.10.7",
    "mlflow==3.7.0",
    "numpy==2.3.3",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.13.0.92",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "psutil==7.1.3",
    "pybind11==3.0.1",          # builds _polyhoop/ (python _polyhoop/build.py)
    "pycocotools==2.0.11",
    "pyyaml==6.0.3",
    "schedulefree==1.4.1",
    "scikit-image==0.26.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.1",
    "transformers==5.1.0",
]

[dependency-groups]
dev = ["pytest==9.0.2"]
# scripts/monitor_training_web.py only
monitor = ["aiohttp==3.14.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
